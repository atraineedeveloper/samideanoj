# Aŭtomataj ĝisdatigoj de dependaĵoj, grupigitaj por malpliigi la laboron.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      dependajxoj:
        patterns: ["*"]
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    ignore:
      # @astrojs/check subtenas nur TypeScript 5 kaj 6. Forigu ĉi tiun regulon
      # kiam ĝi subtenos TypeScript 7 (kontrolu: npm view @astrojs/check peerDependencies).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
