# Deplojo al Cloudflare.
# - Ĉiu puŝo al main deplojas al la provmedio.
# - Produktado deplojiĝas nur mane (Actions → Deplojo → Run workflow),
#   kaj la GitHub-medio "produktado" povas postuli aprobon.
#
# Necesaj sekretoj (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# Sen ili la laborfluo finiĝas sen eraro kaj ne deplojas.
name: Deplojo

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      medio:
        description: "Al kiu medio deploji?"
        required: true
        default: provmedio
        type: choice
        options: [provmedio, produktado]

permissions:
  contents: read

concurrency:
  group: deplojo-${{ github.event.inputs.medio || 'provmedio' }}
  cancel-in-progress: false

jobs:
  deploji:
    name: Deploji al ${{ github.event.inputs.medio || 'provmedio' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.event.inputs.medio || 'provmedio' }}
    env:
      MEDIO: ${{ github.event.inputs.medio || 'provmedio' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Kontroli la sekretojn
        id: sekretoj
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "La sekretoj de Cloudflare ankoraŭ ne estas agorditaj; neniu deplojo."
            echo "pretas=ne" >> "$GITHUB_OUTPUT"
          else
            echo "pretas=jes" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.sekretoj.outputs.pretas == 'jes'
        uses: actions/checkout@v7

      - if: steps.sekretoj.outputs.pretas == 'jes'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - if: steps.sekretoj.outputs.pretas == 'jes'
        name: Instali dependaĵojn
        run: npm ci

      # Antaŭ la konstruo: post ĝi, wrangler uzas la generitan agordon en dist/.
      - if: steps.sekretoj.outputs.pretas == 'jes'
        name: Apliki la migradojn de D1
        run: npx wrangler d1 migrations apply DB --remote --env "$MEDIO" --config wrangler.jsonc

      # La medio estas elektata DUM LA KONSTRUO per CLOUDFLARE_ENV; la Cloudflare-
      # adaptilo generas dist/server/wrangler.json por tiu medio. "--env" dum la
      # deplojo ne havas efikon.
      - if: steps.sekretoj.outputs.pretas == 'jes'
        name: Konstrui por la medio
        run: CLOUDFLARE_ENV="$MEDIO" npm run build

      - if: steps.sekretoj.outputs.pretas == 'jes'
        name: Kontroli la generitan agordon
        run: |
          node -e '
            const c = require("./dist/server/wrangler.json");
            const id = c.d1_databases?.[0]?.database_id ?? "";
            console.log(`Worker: ${c.name}, D1: ${id}`);
            if (!id || id.startsWith("00000000") || id.startsWith("ANSTAT")) {
              console.error("La agordo ne havas validan D1-identigilon por ĉi tiu medio.");
              process.exit(1);
            }
          '

      - if: steps.sekretoj.outputs.pretas == 'jes'
        name: Deploji la Worker
        id: deplojo
        run: |
          npx wrangler deploy | tee deplojo.log
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deplojo.log | head -1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - if: steps.sekretoj.outputs.pretas == 'jes' && steps.deplojo.outputs.url != ''
        name: Sankontrolo
        run: |
          echo "Kontrolas ${{ steps.deplojo.outputs.url }}/sano"
          curl --fail --silent --show-error --retry 6 --retry-delay 5 --retry-all-errors \
            "${{ steps.deplojo.outputs.url }}/sano"
