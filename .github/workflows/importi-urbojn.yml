# Importas la urbojn de GeoNames (pli ol 15 000 loĝantoj) en la elektitan medion.
# Uzo: Actions → Importi urbojn → Run workflow.
# Ĝi estas ripetebla: se D1 atingas sian tagan limon de skriboj, rulu ĝin denove
# la sekvan tagon kaj ĝi daŭrigos. Vidu docs/urboj.md.
name: Importi urbojn

on:
  workflow_dispatch:
    inputs:
      medio:
        description: "En kiun medion?"
        required: true
        default: provmedio
        type: choice
        options: [provmedio, produktado]

permissions:
  contents: read

jobs:
  importi:
    name: Importi urbojn en ${{ inputs.medio }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.medio }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Elŝuti GeoNames
        run: |
          curl -sSfL -o cities15000.zip https://download.geonames.org/export/dump/cities15000.zip
          curl -sSfL -o admin1CodesASCII.txt https://download.geonames.org/export/dump/admin1CodesASCII.txt
          unzip -o cities15000.zip

      - name: Konverti al SQL
        run: node scripts/importi-urbojn.mjs cities15000.txt admin1CodesASCII.txt > urboj.sql

      - name: Importi en D1
        run: npx wrangler d1 execute DB --remote --env "${{ inputs.medio }}" --config wrangler.jsonc --file urboj.sql --yes
